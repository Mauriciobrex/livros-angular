
<h2>Catálogo de Livros</h2>

<table border="1">
  <thead>
    <tr>
      <th>Título</th>
      <th>Resumo</th>
      <th>Editora</th>
      <th>Autores</th>
      <th>Ações</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let livro of livros">
      <td>{{ livro.titulo }}</td>
      <td>{{ livro.resumo }}</td>
      <td>{{ obterNomeEditora(livro.codEditora) }}</td>
      <td>{{ livro.autores.join(', ') }}</td>
      <td>
        <button type="button" (click)="excluir(livro.codigo)">
          Excluir
        </button>
      </td>
    </tr>
  </tbody>
</table>
